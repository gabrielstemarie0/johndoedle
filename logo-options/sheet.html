<!doctype html><meta charset="utf-8"><title>Logo options</title>
<style>
body{margin:0;padding:28px;background:#f4f1ea;font:16px system-ui,sans-serif;color:#1d2433;width:1144px}
h1{margin:0 0 4px;font:800 30px Georgia,serif} p.sub{margin:0 0 22px;color:#555}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.card{background:#fff;border:1px solid #e4dfd3;border-radius:16px;padding:14px;text-align:center}
.card b{display:block;font:800 18px Georgia,serif;margin:8px 0 2px}.card small{color:#666;display:block;min-height:36px;line-height:1.25}
.big svg{width:150px;height:150px}.row{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:8px}
.row svg{width:34px;height:34px}.ic{width:52px;height:52px;border-radius:12px;overflow:hidden}.ic svg{width:52px;height:52px}
.tag{font-size:11px;color:#888}
</style>
<h1>John Doedle: logo options</h1><p class="sub">Each shows the big mark, then how it looks as a small browser icon and a phone app icon.</p>
<div class="grid" id="g"></div>
<script>
const logos = {
A:{n:"Exit sign",d:"The green highway exit sign from the question panel. Instantly says road + game.",svg:`<rect x="6" y="14" width="108" height="92" rx="14" fill="#0b6b3a"/><rect x="12" y="20" width="96" height="80" rx="10" fill="none" stroke="#fff" stroke-width="3"/><text x="60" y="70" text-anchor="middle" font-family="Georgia,serif" font-weight="900" font-size="46" fill="#fff">JD</text><text x="60" y="90" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="800" font-size="11" letter-spacing="3" fill="#ffd23f">DOEDLE</text><rect x="52" y="104" width="6" height="12" fill="#6b7280"/><rect x="62" y="104" width="6" height="12" fill="#6b7280"/>`},
B:{n:"Car from behind",d:"A red car on a road, the same view you play from. Yellow background matches the brand.",svg:`<rect width="120" height="120" rx="26" fill="#f2b632"/><path d="M60 20 L96 112 H24 Z" fill="#4a5060"/><path d="M60 24 V34 M60 46 V60 M60 74 V92" stroke="#fde9a8" stroke-width="4" stroke-linecap="round"/><path d="M40 98 q0-18 20-18 t20 18 v8 h-40z" fill="#d7263d"/><rect x="45" y="84" width="30" height="9" rx="3" fill="#8fd3ff"/><rect x="42" y="98" width="9" height="5" rx="2" fill="#ffd2d2"/><rect x="69" y="98" width="9" height="5" rx="2" fill="#ffd2d2"/><rect x="39" y="104" width="10" height="8" rx="3" fill="#14161c"/><rect x="71" y="104" width="10" height="8" rx="3" fill="#14161c"/>`},
C:{n:"Blend into the crowd",d:"Faceless 'John Doe' figures. The yellow one stands in front: the most average person wins.",svg:`<rect width="120" height="120" rx="26" fill="#1d2433"/><g fill="#5b6478"><circle cx="34" cy="48" r="13"/><path d="M12 100 q0-30 22-30 t22 30 z"/><circle cx="86" cy="48" r="13"/><path d="M64 100 q0-30 22-30 t22 30 z"/></g><circle cx="60" cy="52" r="17" fill="#f2b632"/><path d="M30 108 q0-38 30-38 t30 38 z" fill="#f2b632"/><path d="M54 76 l6 6 6-6 -3 20 h-6z" fill="#1d2433"/>`},
D:{n:"Steering wheel",d:"A wheel with JD on the hub. Simple, bold, works tiny.",svg:`<rect width="120" height="120" rx="26" fill="#f2b632"/><circle cx="60" cy="60" r="40" fill="none" stroke="#1d2433" stroke-width="11"/><path d="M20 62 H46 M74 62 H100 M60 74 V100" stroke="#1d2433" stroke-width="10" stroke-linecap="round"/><circle cx="60" cy="60" r="19" fill="#1d2433"/><text x="60" y="67" text-anchor="middle" font-family="Georgia,serif" font-weight="900" font-size="20" fill="#f2b632">JD</text>`},
E:{n:"Highway shield",d:"Looks like an interstate route sign. Red, white and blue, very recognisable.",svg:`<path d="M60 6 C78 10 92 10 110 6 C112 54 108 90 60 114 C12 90 8 54 10 6 C28 10 42 10 60 6Z" fill="#fff"/><path d="M60 12 C76 15 90 15 104 12 C106 54 102 86 60 108 C18 86 14 54 16 12 C30 15 44 15 60 12Z" fill="#1f4e9e"/><path d="M16 12 C30 15 44 15 60 12 C76 15 90 15 104 12 L104 34 L16 34Z" fill="#d7263d"/><text x="60" y="78" text-anchor="middle" font-family="Georgia,serif" font-weight="900" font-size="38" fill="#fff">JD</text><text x="60" y="27" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="800" font-size="10" letter-spacing="2" fill="#fff">DAILY</text>`},
F:{n:"Stacked wordmark",d:"Just the name, big and bold, with a dashed road line. Most 'clean and slick'.",svg:`<rect width="120" height="120" rx="26" fill="#fff" stroke="#e4dfd3" stroke-width="3"/><text x="60" y="48" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="900" font-size="25" letter-spacing="2" fill="#1d2433">JOHN</text><path d="M16 59 H104" stroke="#f2b632" stroke-width="5" stroke-dasharray="14 8" stroke-linecap="round"/><text x="60" y="92" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="900" font-size="25" letter-spacing="1" fill="#0b6b3a">DOEDLE</text>`},
G:{n:"Question + cone",d:"A question mark whose dot is a traffic cone. Question game + road obstacle in one shape.",svg:`<rect width="120" height="120" rx="26" fill="#1d2433"/><path d="M38 44 Q38 20 62 20 Q86 20 86 42 Q86 56 70 64 Q62 68 62 78" fill="none" stroke="#f2b632" stroke-width="13" stroke-linecap="round"/><path d="M62 88 L72 112 H52 Z" fill="#ff7a1a"/><path d="M59 99 H65 M57 105 H67" stroke="#fff" stroke-width="3"/><rect x="48" y="111" width="28" height="5" rx="2" fill="#ff7a1a"/>`},
H:{n:"Level tiles",d:"Tiles in the four level colors, like a word-game grid. Ties to the John Doe / Joe / Neighbor / Stranger ranking.",svg:`<rect width="120" height="120" rx="26" fill="#1d2433"/><g font-family="Georgia,serif" font-weight="900" font-size="32" fill="#fff" text-anchor="middle"><rect x="12" y="12" width="46" height="46" rx="9" fill="#2f9e63"/><text x="35" y="46">J</text><rect x="62" y="12" width="46" height="46" rx="9" fill="#e0b52a"/><text x="85" y="46">D</text><rect x="12" y="62" width="46" height="46" rx="9" fill="#d9822b"/><text x="35" y="96">O</text><rect x="62" y="62" width="46" height="46" rx="9" fill="#8a4fd6"/><text x="85" y="96">E</text></g>`},
};
const g=document.getElementById("g");
for(const [k,v] of Object.entries(logos)){
  const s=(c)=>`<svg viewBox="0 0 120 120">${v.svg}</svg>`;
  g.insertAdjacentHTML("beforeend",`<div class="card"><div class="big">${s()}</div><b>${k}. ${v.n}</b><small>${v.d}</small><div class="row"><span class="tag">tab</span>${s()}<span class="tag">app</span><div class="ic">${s()}</div></div></div>`);
}
</script>
