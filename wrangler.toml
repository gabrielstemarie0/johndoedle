name = "johndoedle"
main = "src/worker.js"
compatibility_date = "2024-11-01"

# The game itself. Requests that don't match a file here go to the Worker (/api/judge).
[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "johndoedle"
database_id = "e5eedb67-193f-401f-82e4-f17ad0602d90"

# Workers AI judges whether a question fits the answer and groups similar questions.
# Without it the game falls back to simple word matching.
[ai]
binding = "AI"
